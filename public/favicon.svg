<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- ProductTVT — a compass: the product manager's job is direction. -->
  <rect width="64" height="64" rx="14" fill="#7c80f5"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <!-- needle: north in white, south in the deep accent -->
  <path d="M32 12 L38.5 32 L32 27.5 L25.5 32 Z" fill="#ffffff"/>
  <path d="M32 52 L25.5 32 L32 36.5 L38.5 32 Z" fill="#1f1b4d"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  <!-- cardinal ticks -->
  <path d="M32 7v3M32 54v3M7 32h3M54 32h3" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
