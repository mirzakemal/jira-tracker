# Jira Planner — production reverse proxy + static host.
#
# WHY A PROXY IS NOT OPTIONAL
# Atlassian Cloud's REST API sends no CORS headers for arbitrary origins, so a
# browser on https://planner.example.com cannot call
# https://your-site.atlassian.net/rest/... directly — the request is blocked
# before it leaves the page. The Vite dev server proxies /rest, /agile and
# /wiki for exactly this reason; production needs the same.
#
# Deploy with VITE_USE_PROXY=true so the app issues same-origin requests that
# land here.
#
# Substitute: PLANNER_HOST, ATLASSIAN_SITE, and the TLS cert paths.

server {
    listen 443 ssl;
    http2 on;
    server_name PLANNER_HOST;

    ssl_certificate     /etc/ssl/certs/planner.crt;
    ssl_certificate_key /etc/ssl/private/planner.key;

    root /var/www/jira-planner;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────
    # style-src needs 'unsafe-inline': the app injects a <style> element at
    # runtime (main.js addGlobalStyles) and uses ~50 inline style attributes.
    # script-src does NOT need it — there is no eval or inline script.
    # img-src covers Jira avatars, which come from gravatar and atl-paas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.atlassian.net https://secure.gravatar.com https://*.atl-paas.net; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ── Atlassian proxy ─────────────────────────────────────────────────
    # Mirrors vite.config.js. Keep the three prefixes in sync with it.
    location ~ ^/(rest|agile|wiki)/ {
        # ⚠ REQUIRED when this proxy holds the Atlassian credential.
        # Everything past this point can read Jira as the service account, so
        # the route must be behind your own authentication. Replace this with
        # whatever your company login provides (auth_request to an SSO
        # endpoint, mTLS, an authenticating ingress in front of nginx).
        # Leaving it open publishes read access to your Jira.
        auth_request /_authz;

        proxy_pass https://ATLASSIAN_SITE;
        proxy_set_header Host ATLASSIAN_SITE;
        proxy_ssl_server_name on;

        # ── Credential ──────────────────────────────────────────────────
        # The browser sends none (VITE_AUTH_MODE=proxy). This file supplies it:
        #
        #   /etc/nginx/atlassian-auth.inc, mode 0640, owned by root:nginx
        #   proxy_set_header Authorization "Basic BASE64_OF_email:api_token";
        #
        # Generate with:
        #   printf '%s' 'svc-jira@example.com:TOKEN' | base64 -w0
        #
        # Use a dedicated, READ-ONLY Atlassian account. This app never writes
        # to Jira, so the credential needs no write scope, and every user of
        # this deployment acts as that account in Jira's audit log.
        include /etc/nginx/atlassian-auth.inc;

        # Drop anything the browser sent, so a client cannot substitute its own
        # credential or smuggle one through.
        proxy_set_header Cookie "";

        # Jira can be slow on large boards; the client gives up at 30s.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Never cache API responses: they are per-user and authenticated.
        add_header Cache-Control "no-store" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ── Static assets ───────────────────────────────────────────────────
    # Vite fingerprints these, so they can be cached hard and forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker must never be served stale, or a released fix cannot
    # reach a browser that already registered an older one.
    location = /sw.js {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # The entry document names the hashed bundles, so it must always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Hash-based routing: every path resolves to the SPA entry.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Authorization check ─────────────────────────────────────────────
    # Internal endpoint used by auth_request above. Point it at your own
    # session/SSO check. The stub below DENIES everything, so a misconfigured
    # deploy fails closed rather than exposing Jira.
    location = /_authz {
        internal;
        return 403;
    }
}

server {
    listen 80;
    server_name PLANNER_HOST;
    return 301 https://$host$request_uri;
}
